name: Captura diária

# Recaptura as normas e as tabelas das fontes oficiais. Quando algo muda, o
# commit é a própria notícia: a mensagem resume a mudança e o diff mostra o
# texto. Quando nada muda, não há commit.

on:
  schedule:
    - cron: "0 9 * * *" # 6h em Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # O CONFAZ só aceita conexão do Brasil; o pedido passa pelo proxy em
      # São Paulo (pasta proxy/). Sem as duas variáveis, vai direto e falha.
      - name: Capturar
        run: npm run capturar
        env:
          PROXY_BRASIL_URL: ${{ vars.PROXY_BRASIL_URL }}
          PROXY_BRASIL_CHAVE: ${{ secrets.PROXY_BRASIL_CHAVE }}

      - name: Commit do que mudou
        run: |
          git add normas tabelas novidades
          if git diff --cached --quiet; then
            echo "Nada mudou nas fontes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F .cache/resumo.txt
          git push

      # Lei complementar tributária nova, fora do catálogo: vira issue, e alguém
      # decide se ela entra no normas.json. O título leva o número, e é por ele
      # que um aviso já aberto (ou fechado) não se repete.
      - name: Avisar leis complementares novas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .cache/novas-normas.json | while read -r lei; do
            numero=$(jq -r '.numero' <<<"$lei")
            ano=$(jq -r '.data[0:4]' <<<"$lei")
            titulo="Nova lei complementar tributária: LC ${numero}/${ano}"
            if gh issue list --state all --search "\"$titulo\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
              continue
            fi
            gh issue create --title "$titulo" --body "$(jq -r '"Publicada em \(.data).\n\n> \(.ementa)\n\nTexto: \(.url)\n\nPara acompanhar, inclua uma entrada em `normas.json`."' <<<"$lei")"
          done

      - name: Resumo
        if: always()
        run: |
          echo '### Captura' >> "$GITHUB_STEP_SUMMARY"
          if [ -s .cache/resumo.txt ]; then cat .cache/resumo.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'Nada mudou.' >> "$GITHUB_STEP_SUMMARY"; fi
