name: Captura diária

# Recaptura as normas e as tabelas das fontes oficiais. Quando algo muda, o
# commit é a própria notícia: a mensagem resume a mudança e o diff mostra o
# texto. Quando nada muda, não há commit.

on:
  schedule:
    - cron: "0 9 * * *" # 6h em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Capturar
        run: npm run capturar

      - name: Commit do que mudou
        run: |
          git add normas tabelas
          if git diff --cached --quiet; then
            echo "Nada mudou nas fontes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F .cache/resumo.txt
          git push

      - name: Resumo
        if: always()
        run: |
          echo '### Captura' >> "$GITHUB_STEP_SUMMARY"
          if [ -s .cache/resumo.txt ]; then cat .cache/resumo.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'Nada mudou.' >> "$GITHUB_STEP_SUMMARY"; fi
